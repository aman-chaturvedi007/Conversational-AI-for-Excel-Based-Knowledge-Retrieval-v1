[project]
name = "dummy-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "flask>=3.1.3",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "oracledb>=26.0.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0.54",
    "tabulate>=0.10.0",
]

[project.scripts]
dummy-chatbot = "dummy_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
